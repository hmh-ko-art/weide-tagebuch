<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="alternate icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#1e4d2b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="FlockMap" />
    <meta name="application-name" content="FlockMap" />
    <link rel="preload" href="/fonts/barlow-400.woff" as="font" type="font/woff" crossorigin />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>FlockMap</title>
  </head>
  <body>
    <!-- 7s: Ladegerüst – sofort sichtbar, bis React die App zeichnet (ersetzt den Inhalt von #root) -->
    <style>
      .fm-geruest { position: fixed; inset: 0; background: #e9efe6; display: flex; flex-direction: column; font: 16px/1.3 system-ui, -apple-system, "Segoe UI", sans-serif; }
      .fm-geruest-kopf { background: #1e4d2b; color: #fff; padding: calc(env(safe-area-inset-top, 0px) + 12px) 16px 12px; display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 17px; }
      .fm-geruest-punkt { width: 10px; height: 10px; border-radius: 50%; background: #9fd3a6; animation: fm-puls 1s ease-in-out infinite alternate; }
      .fm-geruest-karte { flex: 1; background: linear-gradient(135deg, #dfe8da 25%, #d4e0ce 25%, #d4e0ce 50%, #dfe8da 50%, #dfe8da 75%, #d4e0ce 75%) 0 0 / 48px 48px; }
      @keyframes fm-puls { from { opacity: .35 } to { opacity: 1 } }
      @media (prefers-reduced-motion: reduce) { .fm-geruest-punkt { animation: none } }
    </style>
    <div id="root"><div class="fm-geruest" role="status" aria-live="polite"><div class="fm-geruest-kopf"><span class="fm-geruest-punkt" aria-hidden="true"></span>FlockMap wird geladen …</div><div class="fm-geruest-karte"></div></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
