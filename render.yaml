# Render Blueprint – FlockMap, ehemals Weide-Tagebuch (nur Free-Pläne; Service-/DB-Namen bleiben)
services:
  - type: web
    name: weide-tagebuch
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: DATABASE_URL
        fromDatabase:
          name: weide-tagebuch-db
          property: connectionString
      # Optional: Google Maps statt OpenStreetMap (Key im Dashboard eintragen, dann neu bauen)
      - key: VITE_GOOGLE_MAPS_API_KEY
        sync: false

databases:
  - name: weide-tagebuch-db
    databaseName: weide
    plan: free
    region: frankfurt
