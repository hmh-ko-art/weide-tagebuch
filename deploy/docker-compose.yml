# FlockMap auf eigenem Server (z. B. Hetzner CX23): App + Postgres + Caddy (automatisches HTTPS)
# Start (im Ordner deploy/):  cp .env.example .env  &&  nano .env  &&  docker compose up -d --build
name: flockmap

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: flockmap
      POSTGRES_USER: flockmap
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD in .env setzen}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flockmap -d flockmap"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: ..
      args:
        VITE_GOOGLE_MAPS_API_KEY: ${VITE_GOOGLE_MAPS_API_KEY:-}
        VITE_HOSTER: ${VITE_HOSTER:-hetzner}
    image: flockmap-app:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: "8787"
      DATABASE_URL: postgres://flockmap:${POSTGRES_PASSWORD}@db:5432/flockmap
      DATABASE_SSL: "off"
      FLOCKMAP_ADMIN_TOKEN: ${FLOCKMAP_ADMIN_TOKEN:-}

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN in .env setzen}
      APP_UPSTREAM: ${APP_UPSTREAM:-app:8787}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
